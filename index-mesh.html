<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="src/style.css">
  <title>SAE 402 - MESH DETECTION MODE</title>
  <style>
    /* Indicateur mode mesh */
    .mesh-mode-indicator {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #ff6600, #ff9900);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      z-index: 10000;
      box-shadow: 0 4px 12px rgba(255, 102, 0, 0.4);
    }
  </style>
</head>

<body>
  <div class="mesh-mode-indicator">🔷 MESH DETECTION MODE (Quest 3/Pro)</div>

  <div id="landing-page" class="landing-container">
        
        <nav class="navbar">
            <div class="nav-links">
                <!-- <a href="/about.html">About</a> -->
            </div>
        </nav>

        <main class="content">
            <div class="logo-container">
                <h1 class="logo-text">HOLO<br>BARISTA</h1> 
                <p style="color:#ff6600; font-size:12px; margin-top:10px;">🔷 MESH DETECTION MODE</p>
            </div>

            <p class="headline">
                Dive into the world of coffee in XR.<br>
                Become a legendary master barista.
            </p>

            <button id="start-btn" class="wood-button" style="border-color:#ff6600;">
                <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-coffee-icon lucide-coffee"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></svg></span> PLAY NOW
            </button>
            
            <p class="vr-hint">⚠️ Requires Quest 3 or Quest Pro for mesh detection</p>
        </main>

        <footer class="footer">
            <div class="socials">
                <span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-instagram-icon lucide-instagram"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg></span>
                <span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-twitter-icon lucide-twitter"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></svg></span>
                <span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-youtube-icon lucide-youtube"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/></svg></span>
            </div>
            <p>&copy;2026 JWM MMI Games</p>
        </footer>
    </div>

    <div id="game-container" class="hidden">
        <div class="loader">
            <h2>Scanning your environment...</h2>
            <div class="spinner"></div>
            </div>
    </div>

  <!-- OVERLAY UI for XR mode (kept for domOverlay requirement, content hidden) -->
  <div id="overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1000;">
    
    <!-- DEBUG BUTTON - Opens A-Frame Inspector -->
    <button id="debug-inspector-btn" onclick="document.querySelector('a-scene').components.inspector.openInspector()" 
      style="position:absolute; top:10px; right:10px; padding:8px 12px; background:#ff6600; color:white; border:2px solid #ff9900; 
      border-radius:6px; font-family:monospace; font-size:12px; cursor:pointer; pointer-events:auto; z-index:9999;">
      🔷 Inspector (Mesh Mode)
    </button>

    <!-- MESH TOGGLE BUTTON -->
    <button id="toggle-mesh-btn" onclick="window.toggleMeshVisibility && window.toggleMeshVisibility()" 
      style="position:absolute; top:50px; right:10px; padding:8px 12px; background:#333; color:#ff6600; border:2px solid #ff6600; 
      border-radius:6px; font-family:monospace; font-size:12px; cursor:pointer; pointer-events:auto; z-index:9999;">
      👁️ Toggle Meshes
    </button>

    <!-- MESH STATS BUTTON -->
    <button id="mesh-stats-btn" onclick="console.log(window.getMeshStats && window.getMeshStats())" 
      style="position:absolute; top:90px; right:10px; padding:8px 12px; background:#333; color:#ff6600; border:2px solid #ff6600; 
      border-radius:6px; font-family:monospace; font-size:12px; cursor:pointer; pointer-events:auto; z-index:9999;">
      📊 Mesh Stats
    </button>
    
    <!-- DEBUG STATUS -->
    <div id="debug" style="position:absolute; bottom:10px; left:10px; padding:8px 12px; background:rgba(0,0,0,0.7); 
      color:#ff6600; font-family:monospace; font-size:11px; border-radius:4px; pointer-events:none;">
      🔷 MESH MODE - Status: Ready
    </div>
  </div>

  <a-scene id="scene" 
    physics="debug:false;gravity:-9.8" 
    vr-mode-ui="enabled:false" 
    renderer="alpha:true;antialias:true"
    background="color:transparent"
    inspector="url: https://cdn.jsdelivr.net/gh/aframevr/aframe-inspector@master/dist/aframe-inspector.min.js">

    <a-light type="ambient" intensity="0.6"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.8"></a-light>

    <a-entity id="rig">
      <a-camera id="cam" position="0 1.6 0"></a-camera>
    </a-entity>

    <!-- CUBE (orange pour indiquer mode mesh) -->
    <a-box id="cube" position="0 0.5 -0.7" width="0.15" height="0.15" depth="0.15" color="#FF6600"
      dynamic-body="mass:0.5;linearDamping:0.3;angularDamping:0.3"></a-box>

    <!-- Curseur hit-test (orange pour mode mesh) -->
    <a-ring id="cursor" position="0 0 -1" rotation="-90 0 0" radius-inner="0.05" radius-outer="0.08" color="#FF6600"
      visible="false"></a-ring>

    <!-- Sol de base -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" visible="false" static-body></a-plane>

  </a-scene>

  <script type="module" src="/src/main-mesh.js"></script>
</body>

</html>
